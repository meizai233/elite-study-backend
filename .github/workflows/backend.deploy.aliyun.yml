name: Build and Push to Aliyun
on:
  push:
    tags:
      - "v*.*.*" # 匹配 v1.0.0, v2.1.3 这样的标签

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      # 提取版本号
      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # 登录阿里云容器镜像服务
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v1
        with:
          registry: registry.cn-hangzhou.aliyuncs.com # 根据你的区域更改
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 构建并推送镜像
      - name: Build and Push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./docker/backend.build.Dockerfile
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/elite_study/backend:latest
            registry.cn-hangzhou.aliyuncs.com/elite_study/backend:${{ steps.get_version.outputs.VERSION }}

      # 远程部署
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 登录阿里云镜像服务
            docker login --username=${{ secrets.ALIYUN_USERNAME }} --password=${{ secrets.ALIYUN_PASSWORD }} registry.cn-hangzhou.aliyuncs.com

            # 拉取最新镜像
            docker pull registry.cn-hangzhou.aliyuncs.com/elite_study/backend:latest

            # 使用 docker-compose 部署
            cd ${{ secrets.REMOTE_TARGET }} # 进入目标目录
            docker-compose -f docker/docker-compose.backend.yml down # 停止并删除所有服务的容器和网络
            docker-compose -f docker/docker-compose.backend.yml up -d # 使用 docker-compose 启动服务，后台运行
