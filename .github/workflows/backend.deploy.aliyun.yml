name: Build and Push to Aliyun
on:
  push:
    branches: ["prod"]

jobs:
  build:
    if: github.ref == 'refs/heads/prod' # 仅在 prod 分支触发
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      # # 提取版本号
      # - name: Get version
      #   id: get_version
      #   run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # 登录阿里云容器镜像服务
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v1
        with:
          registry: registry.cn-hangzhou.aliyuncs.com # 根据你的区域更改
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 构建并推送镜像
      - name: Build and Push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./docker/backend.build.Dockerfile
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/elite_study/backend:latest
            registry.cn-hangzhou.aliyuncs.com/elite_study/backend:v1.0.0

      # 远程部署
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 登录阿里云镜像服务
            docker login --username=${{ secrets.ALIYUN_USERNAME }} --password=${{ secrets.ALIYUN_PASSWORD }} registry.cn-hangzhou.aliyuncs.com

            # 删除旧镜像
            docker-compose -f docker/docker-compose.backend.yml down --rmi all

            # 拉取最新镜像
            docker pull registry.cn-hangzhou.aliyuncs.com/elite_study/backend:latest

            # 使用 docker-compose 部署
            cd ${{ secrets.REMOTE_TARGET }}
            echo "Current directory: $(pwd)"
            echo "Listing docker-compose file:"
            cat docker/docker-compose.backend.yml

            # 检查镜像是否存在
            docker images | grep elite_study/backend

            # 启动服务
            docker-compose -f docker/docker-compose.backend.yml up -d
