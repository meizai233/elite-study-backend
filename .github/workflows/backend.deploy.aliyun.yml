name: Build and Push to Aliyun
on:
  push:
    tags:
      - "v*.*.*" # 匹配 v1.0.0, v2.1.3 这样的标签

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      # 提取版本号
      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # 登录阿里云容器镜像服务
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v1
        with:
          registry: registry.cn-hangzhou.aliyuncs.com # 根据你的区域更改
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 构建并推送镜像
      - name: Build and Push
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/elite_study/frontend:latest
            registry.cn-hangzhou.aliyuncs.com/elite_study/frontend:${{ steps.get_version.outputs.VERSION }}
